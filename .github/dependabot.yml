version: 2
updates:
  # 1. Tự động kiểm tra và update GitHub Actions (bao gồm astral-sh/setup-uv)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly" # Kiểm tra hàng tuần

  # 2. Tự động update Python dependencies qua uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly" 
